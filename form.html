<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="WDD 131 Week 5 Product Review Form with HTML, CSS, JavaScript, form validation, and review counter.">
    <meta name="author" content="Adindu Chinweokwu Clementina">
    
    <title>WDD 131 | Product Review Form | Adindu Chinweokwu Clementina</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>

</head>    
<body>
    <h1>Product Review</h1>
    <form action="review.html" method="get">
        <label for="product">Product Name</label>
        <select name="product" id="product" required>
                <option value="" selected disabled>Choose a product</option>
        </select>

        <label>Overall Rating</label>
       
    <div class="stars">
        <div>
            <label for="onestar">★</label>
            <input type="radio" id="onestar" name="stars" value="1" required>
        </div>
    
        <div>
            <label for="twostar">★★</label>
            <input type="radio" id="twostar" name="stars" value="2">
        </div>
    
        <div>
            <label for="threestar">★★★</label>
            <input type="radio" id="threestar" name="stars" value="3">
        </div>
    
        <div>
            <label for="fourstar">★★★★</label>
            <input type="radio" id="fourstar" name="stars" value="4">
        </div>
    
        <div>
            <label for="fivestar">★★★★★</label>
            <input type="radio" id="fivestar" name="stars" value="5">
        </div>
    </div>

        <label for="date">Date of Installation</label>
        <input type="date" name="date" id="date" required>


        <label>Which features did you find useful in the product? <br> 
                <i>(Check all that apply)</i>
        </label>
        <div class="feature">
            <input type="checkbox" id="durability" name="features" value="durability">
            <label for="durability">Durability</label>
        </div>

        <div class="feature">
            <input type="checkbox" id="ease" name="features" value="ease">
            <label for="ease">Ease of Use</label>
        </div>

        <div class="feature">
            <input type="checkbox" id="performance" name="features" value="performance">
            <label for="performance">Performance</label>
        </div>

        <div class="feature">
            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>
        </div>

        <label for="review">Written Review <small>(Optional)</small></label>
        <textarea name="review" id="review"></textarea>

        <label for="name"> Your Name <small>(Optional)</small></label>
        <input type="text" name="name" id="name">

        <button type="submit">Post Review</button>
        
    </form>

    <!--Footer Section-->
    <footer>
        <p>&copy; <span id="currentyear"></span> 🌸 Chinweokwu Clementina Adindu 🌸</p>
        <p>Abia State, Nigeria</p>
        <p id="modified"></p>
    </footer>

</body>
</html>
